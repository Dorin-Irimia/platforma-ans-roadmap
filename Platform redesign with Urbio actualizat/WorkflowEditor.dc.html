    while (q.length) { const n = q.shift(); (adj[n] || []).forEach((to) => { if (level[to] === undefined) { level[to] = level[n] + 1; q.push(to); } }); }
    allKeys.forEach((k) => { if (level[k] === undefined) level[k] = 0; });
    const maxLevel = Math.max(0, ...allKeys.map((k) => level[k]));
    const byLevel = {}; allKeys.forEach((k) => { (byLevel[level[k]] = byLevel[level[k]] || []).push(k); });
    const NW = 156, NH = 48, colGap = 234, rowGap = 82, mx = 20, my = 20;
    let maxRows = 1; for (let l = 0; l <= maxLevel; l++) maxRows = Math.max(maxRows, (byLevel[l] || []).length);
    const pos = {};
    for (let l = 0; l <= maxLevel; l++) { const col = byLevel[l] || []; const off = (maxRows - col.length) * rowGap / 2; col.forEach((k, r) => { pos[k] = { x: mx + l * colGap, y: my + off + r * rowGap }; }); }
    const isFwd = (t) => level[t.to] > level[keyOf(t.from)];
    const hasBack = TR.some((t) => pos[keyOf(t.from)] && pos[t.to] && !isFwd(t));
    const GW = mx * 2 + maxLevel * colGap + NW, GH = my * 2 + (maxRows - 1) * rowGap + NH + (hasBack ? 52 : 0);
    const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
    const dipBase = my + (maxRows - 1) * rowGap + NH + 10;
    let backN = 0;
    const routes = TR.map((t) => {
      const a = pos[keyOf(t.from)], b = pos[t.to]; if (!a || !b) return null;
      if (isFwd(t)) {
        const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
        return { back: false, d: "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 + " " + x2 + "," + y2, lx: (x1 + x2) / 2, ly: (y1 + y2) / 2 };
      }
      const dip = dipBase + (backN++ % 3) * 13, x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y + NH;
      return { back: true, d: "M" + x1 + "," + y1 + " C" + x1 + "," + dip + " " + x2 + "," + dip + " " + x2 + "," + y2, lx: (x1 + x2) / 2, ly: dip };
    });
    const edges = TR.map((t, i) => { const r = routes[i]; if (!r) return null; return h("path", { key: "e" + i, d: r.d, fill: "none", stroke: r.back ? C.brand : C.ink3, strokeWidth: 1.6, opacity: 0.75, strokeDasharray: r.back ? "5 4" : "none", markerEnd: r.back ? "url(#wfarrowb)" : "url(#wfarrow)" }); });
    const edgeLabels = TR.map((t, i) => { const r = routes[i]; if (!r || !t.name) return null; const label = cut(t.name, 18), w = label.length * 5.6 + 14; return h("g", { key: "l" + i }, h("rect", { x: r.lx - w / 2, y: r.ly - 9, width: w, height: 18, rx: 9, fill: "#fff", stroke: r.back ? C.brand : C.line }), h("text", { x: r.lx, y: r.ly + 3.5, textAnchor: "middle", fontSize: 9.5, fontWeight: 700, fill: r.back ? C.brand : C.ink2, fontFamily: "'Plus Jakarta Sans',sans-serif" }, label)); });
    const nodes = allKeys.map((k) => {
      const p = pos[k], id = k === "START" ? null : k, col = stColor(id);
      return h("g", { key: "n" + k, transform: "translate(" + p.x + "," + p.y + ")" },
        h("rect", { width: NW, height: NH, rx: 12, fill: "#fff", stroke: col, strokeWidth: 2 }),
        h("circle", { cx: 17, cy: NH / 2, r: 5, fill: col }),
        h("text", { x: 32, y: NH / 2 + 4.5, fontSize: 12.5, fontWeight: 700, fill: C.ink, fontFamily: "'Plus Jakarta Sans',sans-serif" }, cut(stName(id), 18)));
    });
    const graf = card([secTitle("Graful fluxului"),
      h("div", { style: { background: C.bg, border: "1px solid " + C.line, borderRadius: 12, padding: 16, overflowX: "auto" } },
        h("svg", { width: GW, height: GH, viewBox: "0 0 " + GW + " " + GH, style: { maxWidth: "100%", display: "block" } },
          h("defs", null, h("marker", { id: "wfarrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, h("path", { d: "M0,0 L10,5 L0,10 z", fill: C.ink3 })), h("marker", { id: "wfarrowb", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, h("path", { d: "M0,0 L10,5 L0,10 z", fill: C.brand }))),
          ...edges, ...edgeLabels, ...nodes)),
      h("p", { style: { fontSize: 11.5, color: C.ink3, margin: "10px 2px 0" } }, "Fiecare tranziție dintr-o stare creează o ramură; stările cu mai multe ieșiri se ramifică pe verticală.")]);

    const tree = h("div", { style: { display: "flex", flexDirection: "column", gap: 16 } }, detalii, statesCard, transCard, graf, h("div", null, btn("Salvează fluxul", () => {}, "primary")));
    return { tree };
  }
}
