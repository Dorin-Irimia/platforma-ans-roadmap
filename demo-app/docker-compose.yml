services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ans_demo
      POSTGRES_PASSWORD: ans_demo
      POSTGRES_DB: ans_demo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ans_demo:ans_demo@db:5432/ans_demo
      REDIS_URL: redis://redis:6379
      PORT: 4000
      STORAGE_ROOT: /app/storage
    ports:
      - "4000:4000"
    volumes:
      - documents_storage:/app/storage
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_SUPABASE_URL: https://rpvyorqbbpoasvybzqiq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_0-NUP4OJgdZu-rFJYwMceA_wf_So1jJ
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  documents_storage:
